<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#012832" />
<title>دردشة العرب — شات عربي لحظي</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@500;700&family=Lateef&family=Scheherazade+New:wght@400;700&family=El+Messiri:wght@500;700&family=Lalezar&family=Harmattan&family=Mada:wght@500;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --theme:#03add8; --theme-dk:#02799c; --theme-glow:rgba(3,173,216,.55);
  --dark:#012832; --dark2:#023441; --dark3:#034b5e;
  --red:#e0473e; --green:#37d67a; --amber:#ff9f1a; --gold:#e6a817;
  --ink:#163038; --muted:#7d929c; --line:#e3edf0; --panel:#ffffff;
  --ui:'Cairo',sans-serif; --msg:'Amiri','Cairo',serif; --disp:'Reem Kufi','Cairo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);color:var(--ink);overflow:hidden;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 560px at 88% -12%, rgba(3,173,216,.16), transparent 60%),
    radial-gradient(900px 500px at 4% 114%, rgba(1,40,50,.18), transparent 60%),
    repeating-linear-gradient(-45deg, rgba(3,173,216,.018) 0 2px, transparent 2px 16px),#e7f0f3;}
button{font-family:var(--ui);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--ui);outline:none}
ul{list-style:none}.hidden{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(3,173,216,.32);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(3,173,216,.55)}
::-webkit-scrollbar-track{background:transparent}

/* ألوان + خطوط + تدرج الأسماء */
.bc1{color:#f33}.bc2{color:#f63}.bc3{color:#f93}.bc4{color:#fc3}.bc5{color:#cc0}.bc6{color:#9c0}
.bc7{color:#59b300}.bc8{color:#829356}.bc9{color:#1a9e1a}.bc10{color:#00b347}.bc11{color:#00a86b}
.bc12{color:#00a89d}.bc13{color:#0cc}.bc14{color:#03add8}.bc15{color:#36f}.bc16{color:#107896}
.bc17{color:#004d99}.bc18{color:#63f}.bc19{color:#93f}.bc20{color:#c3f}.bc21{color:#f3f}
.bc22{color:#f3c}.bc23{color:#f39}.bc24{color:#f36}
.bf1{font-family:'Cairo'}.bf2{font-family:'Amiri'}.bf3{font-family:'Reem Kufi'}.bf4{font-family:'Lateef';font-size:1.18em}
.bf5{font-family:'Scheherazade New';font-size:1.2em}.bf6{font-family:'El Messiri'}.bf7{font-family:'Lalezar';letter-spacing:.5px}
.bf8{font-family:'Harmattan'}.bf9{font-family:'Mada'}.bf10{font-family:'Tajawal'}.bf11{font-family:'Amiri';font-style:italic}
.bf12{font-family:'Cairo';font-weight:900;letter-spacing:.4px}.bf13{font-family:'Reem Kufi';font-weight:700}
.gradname{-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

/* ===== شاشة الدخول ===== */
.gate{position:fixed;inset:0;display:grid;place-items:center;z-index:60;overflow:hidden;background:linear-gradient(155deg,var(--dark),var(--dark2) 55%,var(--dark3))}
.gate::before{content:'';position:absolute;inset:0;opacity:.5;
  background:radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.5), transparent),radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,.35), transparent),radial-gradient(2px 2px at 40% 80%, rgba(255,255,255,.4), transparent),radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,.4), transparent);background-size:340px 340px;animation:starDrift 60s linear infinite}
@keyframes starDrift{to{background-position:340px 170px}}
.g-orb{position:absolute;border-radius:50%;filter:blur(72px);pointer-events:none}
.g-orb.a{width:48vmax;height:48vmax;top:-20vmax;right:-14vmax;opacity:.42;background:radial-gradient(circle,var(--theme),transparent 70%);animation:float1 16s ease-in-out infinite alternate}
.g-orb.b{width:40vmax;height:40vmax;bottom:-18vmax;left:-12vmax;opacity:.3;background:radial-gradient(circle,#05d0ff,transparent 70%);animation:float2 20s ease-in-out infinite alternate}
@keyframes float1{to{transform:translate(5vmax,4vmax) scale(1.14)}}@keyframes float2{to{transform:translate(-4vmax,-3vmax) scale(1.1)}}
.g-card{position:relative;width:min(440px,93vw);padding:36px 32px 30px;border-radius:24px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(16px);box-shadow:0 36px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);animation:rise .7s cubic-bezier(.2,.9,.3,1.25)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:none}}
.g-mark{width:70px;height:70px;border-radius:20px 20px 6px 20px;display:grid;place-items:center;font-size:32px;margin:0 auto 16px;color:#fff;background:linear-gradient(140deg,var(--theme),#05d0ff);box-shadow:0 0 30px var(--theme-glow);animation:glow 2.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 48px rgba(3,173,216,.95)}}
.g-title{text-align:center;color:#fff;font-family:var(--disp);font-size:32px;font-weight:700;letter-spacing:.5px}
.g-sub{text-align:center;color:#9fc3cf;font-size:13px;margin:6px 0 6px}
.g-tabs{display:flex;gap:6px;margin:18px 0 16px;background:rgba(0,0,0,.22);padding:5px;border-radius:12px}
.g-tab{flex:1;padding:9px;border-radius:9px;color:#9fc3cf;font-weight:700;font-size:13px;transition:.22s}
.g-tab.on{background:linear-gradient(140deg,var(--theme),var(--theme-dk));color:#fff;box-shadow:0 4px 14px rgba(3,173,216,.4)}
.g-label{display:block;color:#bfe3ee;font-size:12px;font-weight:700;margin:13px 0 7px}
.g-input{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.16);background:rgba(0,0,0,.24);color:#fff;font-size:15px;font-weight:600;transition:.2s}
.g-input:focus{border-color:var(--theme);box-shadow:0 0 0 4px rgba(3,173,216,.22)}
.g-input::placeholder{color:#6f93a0}
.g-colors{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.gc{height:30px;border-radius:8px;cursor:pointer;transition:.16s;position:relative}
.gc:hover{transform:scale(1.16)}
.gc.sel::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.g-btn{width:100%;margin-top:22px;padding:14px;border-radius:12px;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(140deg,var(--theme),var(--theme-dk));transition:.22s;box-shadow:0 8px 24px rgba(3,173,216,.5)}
.g-btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(3,173,216,.65)}
.g-btn:active{transform:translateY(0) scale(.98)}.g-btn .ar{transition:.22s}.g-btn:hover .ar{transform:translateX(-5px)}
.g-status{text-align:center;font-size:12px;margin-top:12px;min-height:17px}.g-status.err{color:#ff9b9b}.g-status.ok{color:#8fe6b6}
.g-foot{text-align:center;color:#6f93a0;font-size:11px;margin-top:16px}

/* ===== التطبيق ===== */
.app{display:flex;flex-direction:column;height:100%}
.head{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;position:relative;z-index:30;background:linear-gradient(120deg,var(--dark),var(--dark2) 55%,var(--dark3));color:#fff;box-shadow:0 2px 18px rgba(1,40,50,.42);overflow:hidden}
.head::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);background-size:240% 100%;animation:shine 9s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-100% 0}}
.h-mark{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:18px}
.h-mark .bub{width:35px;height:35px;border-radius:10px 10px 3px 10px;display:grid;place-items:center;font-size:17px;background:linear-gradient(140deg,var(--theme),#05d0ff);box-shadow:0 0 16px var(--theme-glow)}
.room-pill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);padding:8px 15px;border-radius:99px;font-size:13px;font-weight:700;transition:.25s}
.room-pill:hover{background:rgba(3,173,216,.3);transform:translateY(-1px)}
.room-pill .cnt{color:#7fe3ff;font-weight:900;background:rgba(0,0,0,.25);padding:1px 8px;border-radius:99px;font-size:11px}
/* شريط الرتبة/النقاط في الهيدر */
.rank-pill{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);padding:5px 12px 5px 6px;border-radius:99px;cursor:pointer;transition:.25s}
.rank-pill:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.rank-pill .ri{font-size:14px}
.rank-pill .rm{display:flex;flex-direction:column;line-height:1.1}
.rank-pill .rn{font-size:11px;font-weight:800}
.rank-pill .pts{font-size:9.5px;color:#9fc3cf}
.rank-pill .bar{width:54px;height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.rank-pill .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#ffd76a);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.h-spacer{flex:1}
.h-ico{position:relative;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:17px;transition:.2s}
.h-ico:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.h-ico .badge{position:absolute;top:3px;left:3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#bfe3ee;background:rgba(255,255,255,.08);padding:7px 13px;border-radius:99px;transition:.25s}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:live 2s infinite}
.conn.bad{color:#ffd0cd}.conn.bad i{background:var(--red);animation:none}
@keyframes live{70%{box-shadow:0 0 0 7px rgba(55,214,122,0)}100%{box-shadow:0 0 0 0 rgba(55,214,122,0)}}

.layout{flex:1;display:flex;min-height:0;position:relative}
.center{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.center-bg{position:absolute;inset:0;pointer-events:none;background-size:cover;background-position:center;opacity:.12;transition:opacity .5s}

.show_chat{flex:1;overflow-y:auto;padding:14px 18px 6px;position:relative}
#chat_logs{display:flex;flex-direction:column;justify-content:flex-end;min-height:100%;gap:1px}
.row{display:flex;align-items:flex-start;gap:10px;padding:6px 9px;border-radius:11px;animation:msgIn .34s cubic-bezier(.2,.8,.3,1) both;transition:background .16s}
.row:hover{background:rgba(3,173,216,.06)}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;flex-shrink:0;box-shadow:0 2px 7px rgba(0,0,0,.2);transition:.22s;cursor:pointer;background-size:cover;background-position:center}
.row:hover .av{transform:scale(1.13);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--theme)}
.body{min-width:0;line-height:23px;font-family:var(--msg)}
.uname{font-weight:700;font-size:14.5px;cursor:pointer;transition:.15s}.uname:hover{filter:brightness(1.15)}
.rank{font-size:11px;margin:0 3px;opacity:.9}
.msg{font-weight:700;color:#0e242c;font-size:16px;word-wrap:break-word}
.msg .mention{color:var(--theme-dk);background:rgba(3,173,216,.14);border-radius:6px;padding:0 4px;cursor:pointer;font-weight:800}
.cdate{margin-inline-start:auto;font-size:10px;color:var(--muted);opacity:0;transition:.2s;padding-top:7px;white-space:nowrap}
.row:hover .cdate{opacity:1}
.row.mine{background:rgba(3,173,216,.09)}
.row.sys{justify-content:center}
.syspill{display:inline-block;padding:4px 15px;border-radius:20px;font-size:11.5px;font-family:var(--ui);font-weight:600;background:rgba(234,246,250,.9);color:#4a7280;border:1px solid #d3e9f0}
.row.join .syspill{background:rgba(226,247,236,.92);color:#0d6b3a;border-color:#bfe9d2}
.row.leave .syspill{background:rgba(241,244,245,.92);color:#7d8a90;border-color:#e0e6e8}
.row.warn .syspill{background:rgba(253,241,223,.95);color:#8a5a10;border-color:#f2d9ac}
.row.rankup .syspill{background:linear-gradient(120deg,rgba(230,168,23,.95),rgba(255,215,106,.95));color:#5a3d00;border-color:#e6a817;font-weight:800;box-shadow:0 4px 16px rgba(230,168,23,.4);animation:rankFlash 1s ease}
.row.mod .syspill{background:rgba(8,145,178,.12);color:#0e7490;border-color:#0891b2}
@keyframes rankFlash{0%{transform:scale(.7);opacity:0}40%{transform:scale(1.08)}100%{transform:scale(1)}}

.typing-bar{min-height:22px;padding:2px 22px;font-size:11px;color:var(--theme-dk);font-family:var(--ui);display:flex;align-items:center;gap:7px;font-weight:600}
.typing-bar .dots{display:inline-flex;gap:4px}
.typing-bar .dots i{width:5px;height:5px;border-radius:50%;background:var(--theme);animation:bnc 1s infinite}
.typing-bar .dots i:nth-child(2){animation-delay:.15s}.typing-bar .dots i:nth-child(3){animation-delay:.3s}
@keyframes bnc{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.composer-wrap{padding:8px 16px 16px;position:relative}
.composer{position:relative;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 7px 6px 6px;box-shadow:0 5px 20px rgba(1,40,50,.08);transition:.25s}
.composer:focus-within{border-color:var(--theme);box-shadow:0 0 0 4px rgba(3,173,216,.15),0 5px 20px rgba(1,40,50,.1)}
.c-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;transition:.2s;flex-shrink:0;color:var(--theme-dk)}
.c-ico:hover{background:#eaf6fa;transform:scale(1.14) rotate(-8deg)}
.c-input{flex:1;border:none;background:none;font-family:var(--msg);font-size:16px;font-weight:600;padding:9px 5px;min-width:0;color:var(--ink)}
.c-input::placeholder{color:#9fb2ba}
.c-send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;flex-shrink:0;background:linear-gradient(140deg,var(--theme),var(--theme-dk));transition:.2s;box-shadow:0 4px 14px rgba(3,173,216,.5)}
.c-send:hover{transform:scale(1.12)}.c-send:active{transform:scale(.92)}
.emo-pop{position:absolute;bottom:74px;right:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:none;grid-template-columns:repeat(8,1fr);gap:3px;box-shadow:0 14px 40px rgba(1,40,50,.24);z-index:35}
.emo-pop.open{display:grid;animation:msgIn .2s ease}
.emo-pop button{font-size:21px;width:36px;height:36px;border-radius:9px;transition:.14s}
.emo-pop button:hover{background:#eaf6fa;transform:scale(1.28)}

/* بانل اليمين */
.right{width:272px;background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;z-index:10}
.right-tabs{display:flex;background:var(--dark);color:#fff}
.rt{flex:1;padding:13px 4px;font-size:15px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.rt:hover{background:rgba(255,255,255,.08)}.rt.on{background:var(--theme)}
.rt.on::after{content:'';position:absolute;bottom:0;right:25%;left:25%;height:3px;background:#fff;border-radius:9px 9px 0 0}
.right-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--theme-dk);padding:12px 14px;border-bottom:1px solid var(--line);background:#f7fbfc}
.right-head b{color:var(--theme)}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:live 2s infinite}
.right-data{flex:1;overflow-y:auto;padding:6px}
.u{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;cursor:pointer;animation:msgIn .26s ease both;transition:.17s}
.u:hover{background:#eef8fb;transform:translateX(-3px)}
.u .av{width:34px;height:34px;position:relative}
.u .av .st{position:absolute;bottom:-1px;left:-1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid #fff}
.u .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .md{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .ty{font-size:10px;color:var(--theme);font-style:italic}
.u .rk{margin-inline-start:auto;font-size:13px;flex-shrink:0}
.ri{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.2s}
.ri:hover{background:#eef8fb;border-color:#cfeaf3;transform:translateX(-3px)}
.ri .ric{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:linear-gradient(140deg,#e3f5fa,#cdeef7)}
.ri.cur .ric{background:linear-gradient(140deg,var(--theme),var(--theme-dk))}
.ri .rn{font-size:13px;font-weight:700}.ri .rc{font-size:10.5px;color:var(--muted)}.ri .lk{margin-inline-start:auto;color:var(--amber)}
/* حائط */
.wall-box{padding:10px}
.wall-post{background:#f7fbfc;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px;animation:msgIn .3s ease}
.wall-post .wp-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.wall-post .wp-h .av{width:28px;height:28px;font-size:12px}
.wall-post .wp-h .nm{font-weight:700;font-size:13px}
.wall-post .wp-t{font-family:var(--msg);font-size:14px;line-height:1.7;color:#22383f;word-wrap:break-word}
.wall-post .wp-a{display:flex;gap:14px;margin-top:9px;font-size:12px;color:var(--muted)}
.wall-post .wp-a button{display:flex;align-items:center;gap:5px;font-weight:700;transition:.15s}
.wall-post .wp-a button:hover{color:var(--theme)}.wall-post .wp-a button.liked{color:var(--red)}
.wp-cmts{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;display:flex;flex-direction:column;gap:6px}
.wp-cmt{font-size:12px;line-height:1.6}.wp-cmt b{font-weight:700}
.wp-cmt-in{display:flex;gap:6px;margin-top:7px}
.wp-cmt-in input{flex:1;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px}
.wp-cmt-in button{background:var(--theme);color:#fff;border-radius:99px;padding:0 13px;font-size:12px;font-weight:700}
.wall-new{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.wall-new textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-family:var(--msg);font-size:14px;resize:vertical;min-height:54px}
.wall-new button{align-self:flex-start;background:linear-gradient(140deg,var(--theme),var(--theme-dk));color:#fff;border-radius:99px;padding:8px 18px;font-weight:700;font-size:13px}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:30px 10px}

/* بانل الإشعارات المنزلق */
.notify-panel{position:fixed;top:56px;inset-inline-end:14px;width:330px;max-width:92vw;max-height:70vh;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(1,40,50,.32);z-index:55;display:none;flex-direction:column;overflow:hidden;animation:privIn .28s cubic-bezier(.2,.9,.3,1.2)}
.notify-panel.open{display:flex}
.np-top{display:flex;align-items:center;padding:13px 15px;background:linear-gradient(120deg,var(--dark),var(--dark2));color:#fff;font-family:var(--disp);font-weight:700}
.np-top .x{margin-inline-start:auto;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;transition:.2s}
.np-top .x:hover{background:rgba(255,255,255,.16);transform:rotate(90deg)}
.np-top .readall{font-size:11px;font-family:var(--ui);color:#9fc3cf;cursor:pointer;margin-inline-start:10px}
.np-top .readall:hover{color:#fff}
.np-list{overflow-y:auto;flex:1}
.np-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);animation:msgIn .25s ease;transition:.15s}
.np-item:hover{background:#f7fbfc}.np-item.unread{background:#f0fafd}

const $ = (id) => document.getElementById(id);
const COLOR_HEX = ['#f33','#f63','#f93','#fc3','#cc0','#9c0','#59b300','#829356','#1a9e1a','#00b347','#00a86b','#00a89d','#0cc','#03add8','#36f','#107896','#004d99','#63f','#93f','#c3f','#f3f','#f3c','#f39','#f36'];

const FONT_NAMES = ['Cairo','Amiri','Reem Kufi','Lateef','Scheherazade','El Messiri','Lalezar','Harmattan','Mada','Tajawal','Amiri مائل','Cairo عريض','Kufi عريض'];

];

const behavior = { moves:0, keys:0, clicks:0, since:Date.now() };
document.addEventListener('mousemove', () => { behavior.moves++; }, { passive:true });
document.addEventListener('keydown', () => { behavior.keys++; }, { passive:true });

function behaviorSnapshot(){ const s = { ...behavior, dt: Date.now() - behavior.since }; return s; }

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const avStyle = (u) => u && u.avatar ? `background-image:url('${esc(u.avatar)}')` : `background:${avHue(u && u.name || '?')}`;
const avHue = (n) => { let h = 0; for (const c of n) h = (h*31 + c.charCodeAt(0)) % 360; return `hsl(${h},55%,45%)`; };

  const c=[c2,c1,c0]; return `linear-gradient(to ${type==='h'?'left':'top'}, ${c.join(',')})`;
}
function genBgrads(){ let css=''; for(let i=1;i<=80;i++){ const h1=(i*47)%360,h2=(h1+40)%360; css+=`.bg${i}{background-image:linear-gradient(120deg,hsl(${h1},75%,52%),hsl(${h2},80%,45%))}`; } const st=document.createElement('style'); st.textContent=css; document.head.appendChild(st); }
genBgrads();
function applyName(el, u){
  el.className = el.className.replace(/\b(bc\d+|bg\d+|bf\d+|gradname)\b/g,'').trim();
  if (u.cgrad){ el.style.backgroundImage = u.cgrad; el.classList.add('gradname'); }
  else if (u.grad){ el.style.backgroundImage = ''; el.classList.add('bg'+u.grad, 'gradname'); }
  else { el.style.backgroundImage = ''; el.classList.add('bc'+(u.color||14)); }
  if (u.font) el.classList.add('bf'+u.font);
}
// بصمة بسيطة للفرونت (canvas + سمات) — مش للتتبع، بس anti-multi-login
let FP = '';
(async function makeFP(){
  try {
    const c = document.createElement('canvas'); c.width=200; c.height=50;
    const x = c.getContext('2d'); x.textBaseline='top'; x.font="14px 'Cairo'"; x.fillStyle='#03add8';
    x.fillText('دردشة العرب 🔒', 2, 2);
    const parts = [c.toDataURL(), screen.width+'x'+screen.height, Intl.DateTimeFormat().resolvedOptions().timeZone, navigator.language, navigator.hardwareConcurrency||''];
    let h=0; const s=parts.join('|'); for(let i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; }
    FP = Math.abs(h).toString(36);
  } catch(e){ FP = 'fp'+Math.random().toString(36).slice(2,8); }
})();

/* Socket */
function connectSocket(){
  setConn(true,'جاري الاتصال...');
  socket = io({ transports:['websocket','polling'], reconnection:true, reconnectionDelay:1500 });
  socket.on('connect', ()=>{
    setConn(true,'متصل');
    socket.emit('join', { name:me.name, color:me.color, grad:me.grad, font:me.font, cgrad:me._user?.nameCgrad||null, avatar:me.avatar, mood:me.mood, room:curRoom, token:me.token, fp:FP, ua:navigator.userAgent, modBrowser:isModBrowser });
  });
  socket.on('disconnect', ()=> setConn(false,'مقطوع — polling شغال'));
  socket.on('connect_error', ()=> setConn(false,'خطأ — polling شغال'));
  socket.on('self:id', (id)=>{ me.sid=id; });
  socket.on('self:user', (u)=>{ absorbUser(u); updateRankPill(); });
  socket.on('room:info', (r)=>{
    curRoom=r.slug; $('room_name').textContent=r.name; $('room_icon').textContent=r.icon;
    if (r.accent){ const rgb=r.accent.replace(/rgba?\(([^)]+)\)/,(m,a)=>{ const p=a.split(',').map(x=>parseFloat(x)); return `rgb(${p[0]},${p[1]},${p[2]})`; }); document.documentElement.style.setProperty('--theme', rgb); }
    if (r.bgImage){ $('center_bg').style.backgroundImage=`url('${esc(r.bgImage)}')`; $('center_bg').style.opacity='.14'; } else $('center_bg').style.backgroundImage='';
  });
  socket.on('room:topic', (t)=>{ /* ممكن نعرضه تحت الهيدر لاحقاً */ });
  socket.on('chat:history', (h)=>{ $('chat_logs').innerHTML=''; knownIds.clear(); lastSeen=0; h.logs.forEach(renderLog); scrollChat(true); });
  socket.on('chat:message', (m)=>{ if(!knownIds.has(m.id)) renderLog(m); });
  socket.on('chat:system', (s)=> addSys(s.text, s.warn?'warn':'sys'));
  socket.on('presence:list', renderUsers);
  socket.on('chat:typing', (t)=>{ if(t.on) typingMap.set(t.sid,t.name); else typingMap.delete(t.sid); renderTyping(); });
  socket.on('points:update', (p)=>{ me.points=p.points; me.rank=p.rank; me.nextRankPts=p.next; if(me._user){ me._user.points=p.points; me._user.rank=p.rank; } localStorage.setItem('ac_user', JSON.stringify(me._user||{})); updateRankPill(); if(p.gained>0) floatPoints(p.gained); });
  socket.on('rank:up', (r)=>{ me.rankName=r.name; me.rankIcon=r.icon; updateRankPill(); rankUpFx(r); toast(`🎉 ترقّيت إلى ${r.name}!`, 'gold'); });
  socket.on('notify:new', (n)=>{ notifyList.unshift(n); renderNotify(); bumpBadge(1); if(n.type==='pm') toast(`✉️ رسالة خاصة من ${n.from}`,'info'); else if(n.type==='gift') toast(`🎁 ${n.text}`,'gold'); else if(n.type==='mention') toast(`@ ${n.from} ذكرك`,'info'); });
  socket.on('notify:count', (c)=>{ setBadge(c); });
  socket.on('private:history', (h)=>{ privWith=h.with; $('priv_name').textContent=h.with; const av=$('priv_av'); av.style.cssText=avStyle({name:h.with}); av.textContent=h.with[0]; $('priv_body').innerHTML=''; h.msgs.forEach(renderPriv); $('priv').classList.add('open'); scrollPriv(); });
  socket.on('private:message', (m)=>{
    if (m.from===me.name || m.to===me.name){
      if (!privWith && m.from!==me.name) openPrivBox(m.from);
      if (privWith===m.from || privWith===m.to){ renderPriv(m); scrollPriv(); }
      if (m.from!==me.name) bumpBadge(0, true);
    }
  });
  socket.on('error', (e)=> toast(e.msg||'خطأ','err'));
}

/* رسم الشات + منشن */
function linkifyMentions(text, mentions){
  let safe = esc(text);
  (mentions||[]).forEach((mn)=>{ const re = new RegExp('(@'+mn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','g'); safe = safe.replace(re, `<span class="mention" data-name="${esc(mn)}">$1</span>`); });
  // منشن مش في القائمة برضه نلوّنه
  safe = safe.replace(/(^|\s)@([\u0600-\u06FF\w_]{2,24})/g, (m,sp,nm)=> m.includes('class="mention"')?m:`${sp}<span class="mention" data-name="${esc(nm)}">@${esc(nm)}</span>`);
  return safe;
}

  if (m.kind==='rankup') return addSys(`⬆️ ${esc(m.name)} ${esc(m.text)}`, 'rankup');
  if (m.kind==='mod') return addSys(`🛡️ ${esc(m.text)}`, 'mod');
  const mine = m.sid===me.sid || myIds.has(m.id);
  const li=document.createElement('li'); li.className='row'+(mine?' mine':'');
  const rk = RANK_ICON[m.rank]||'';
  li.innerHTML =
    `<span class="av" style="${avStyle(m)}" data-name="${esc(m.name)}">${m.avatar?'':esc((m.name||'?')[0])}</span>
     <span class="body"><span class="uname" data-name="${esc(m.name)}">${esc(m.name)}</span>${rk?`<span class="rank" style="color:${RANK_COLOR[m.rank]||'#888'}">${rk}</span>`:''}<span class="msg"> : ${linkifyMentions(m.text, m.mentions)}</span></span>
     <span class="cdate">${hm(m.t)}</span>`;
  applyName(li.querySelector('.uname'), m);

function bindWall(){
  $('right_data').querySelectorAll('.wall-post .like').forEach(b=> b.addEventListener('click', async ()=>{ if(!me.token) return toast('سجل دخول الأول','err'); const id=b.closest('.wall-post').dataset.id; const r=await fetch('/api/wall/like',{method:'POST',headers:{'Content-Type':'application/json','x-token':me.token},body:JSON.stringify({id})}); const d=await r.json(); if(d.ok){ b.classList.toggle('liked',d.liked); b.querySelector('span').textContent=d.likesCount; } }));
  $('right_data').querySelectorAll('.wall-post .cmt').forEach(b=> b.addEventListener('click', async ()=>{ if(!me.token) return toast('سجل دخول الأول','err'); const wrap=b.closest('.wall-post').querySelector('.wp-cmts-wrap'); if(wrap.dataset.open){ wrap.innerHTML=''; wrap.dataset.open=''; return; } wrap.dataset.open='1'; wrap.innerHTML=`<div class="wp-cmts"></div><div class="wp-cmt-in"><input placeholder="تعليق..."><button>↵</button></div>`; const inp=wrap.querySelector('input'); const send=async ()=>{ const t=inp.value.trim(); if(!t) return; const id=b.closest('.wall-post').dataset.id; const r=await fetch('/api/wall/comment',{method:'POST',headers:{'Content-Type':'application/json','x-token':me.token},body:JSON.stringify({id,text:t})}); const d=await r.json(); if(d.ok){ inp.value=''; const c=d.comment; wrap.querySelector('.wp-cmts').insertAdjacentHTML('beforeend',`<div class="wp-cmt"><b class="bc${c.color}">${esc(c.name)}</b>: ${esc(c.text)}</div>`); b.querySelector('span').textContent=d.commentsCount; } }; wrap.querySelector('button').addEventListener('click',send); inp.addEventListener('keydown',(e)=>{ if(e.key==='Enter') send(); }); }));
}

/* البروفايل + رفع صورة */
function openProfile(name, m){
  if(name===me.name){ openSettings(); return; }
  const u=m||{};
  openModal('الملف الشخصي', `<div class="pf-h"><span class="pf-av" style="${avStyle(u)}">${u.avatar?'':esc(name[0])}</span><div><div class="pf-nm">${esc(name)}</div><div class="pf-rk" style="color:${RANK_COLOR[u.rank]||'#888'}">${RANK_ICON[u.rank]||''} ${u.rank?('رتبة '+u.rank):'عضو'}</div>${u.mood?`<div class="pf-md">${esc(u.mood)}</div>`:''}</div></div>
    <div class="pf-stats"><div class="pf-st"><b>${(name.length*7919)%9000+300}</b><span>نقطة</span></div><div class="pf-st"><b>${u.rank||0}</b><span>الرتبة</span></div><div class="pf-st"><b>${(name.length*13)%40+1}</b><span>صديق</span></div></div>
    <div class="pf-acts"><button class="pf-btn b1" id="pf_msg">✉️ رسالة خاصة</button><button class="pf-btn b2" id="pf_gift">🎁 إهداء نقاط</button><button class="pf-btn b3" id="pf_ignore">🚫 تجاهل</button><button class="pf-btn b4" id="pf_report">⚠️ إبلاغ</button></div>`);
  const nm=$('mo_body').querySelector('.pf-nm'); applyName(nm, u);
  $('pf_msg').onclick=()=>{ closeModal(); openPrivBox(name); };
  $('pf_gift').onclick=()=>{ closeModal(); const amt=prompt('كم نقطة تهدي لـ '+name+'؟ (عندك '+(me.points||0)+')','50'); if(amt&&socket) socket.emit('chat:send',{text:`/gift @${name} ${amt}`}); };
  $('pf_ignore').onclick=()=> toast(`تم إضافة ${name} للتجاهل`,'info');
  $('pf_report').onclick=()=> toast('تم إرسال الإبلاغ، شكراً لك','ok');
}

/* الخاص */
function openPrivBox(name){ privWith=name; $('priv_name').textContent=name; const av=$('priv_av'); av.style.cssText=avStyle({name}); av.textContent=name[0]; $('priv_body').innerHTML='<div class="empty">جاري تحميل المحادثة...</div>'; $('priv').classList.add('open'); if(socket&&socket.connected) socket.emit('private:open',{name}); }
function renderPriv(m){ if($('priv_body').querySelector('.empty')) $('priv_body').innerHTML=''; const d=document.createElement('div'); d.className='pb '+(m.mine?'mine':'them'); d.textContent=m.text; $('priv_body').appendChild(d); }
function scrollPriv(){ $('priv_body').scrollTop=1e6; }
$('priv_close').addEventListener('click', ()=>{ $('priv').classList.remove('open'); privWith=null; });
$('priv_form').addEventListener('submit', (e)=>{ e.preventDefault(); const v=$('priv_msg').value.trim(); if(!v||!privWith) return; $('priv_msg').value=''; if(socket&&socket.connected) socket.emit('private:send',{to:privWith,text:v,behavior:behaviorSnapshot()}); });

/* الإشعارات */
$('btn_notify').addEventListener('click', async ()=>{
  $('notify_panel').classList.toggle('open');
  if (me.token && $('notify_panel').classList.contains('open')){ try{ const r=await fetch('/api/notify',{headers:{'x-token':me.token}}); const d=await r.json(); notifyList=d.list; setBadge(d.unread); renderNotify(); }catch(e){} }
});
$('np_close').addEventListener('click', ()=> $('notify_panel').classList.remove('open'));
$('np_readall').addEventListener('click', async ()=>{ if(!me.token) return; await fetch('/api/notify/read',{method:'POST',headers:{'x-token':me.token}}); notifyList.forEach(n=>n.read=true); setBadge(0); renderNotify(); });
function renderNotify(){
  $('np_list').innerHTML = notifyList.length ? notifyList.map(n=>`<div class="np-item ${n.read?'':'unread'}"><span class="ic">${NOTIFY_IC[n.type]||'🔔'}</span><span><span class="tx"><b>${esc(n.from||'النظام')}</b> ${esc(n.text||'')}</span><span class="tm">${rel(n.createdAt||n.t)}</span></span></div>`).join('') : '<div class="empty">مفيش إشعارات</div>';
}
function setBadge(c){ const b=$('notify_badge'); if(c>0){ b.textContent=c>99?'99+':c; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function bumpBadge(n, priv){ if(priv){ /* الخاص له toast بس */ return; } setBadge(($('notify_badge').classList.contains('hidden')?0:(+$('notify_badge').textContent||0))+n); }

/* الإعدادات + رفع الأفاتار */
$('btn_settings').addEventListener('click', openSettings);
$('rank_pill').addEventListener('click', openSettings);
let setCgrad={ c0:'#03add8', c1:'#63f', c2:'#f39', type:'m' };
function openSettings(){
  const u=me._user||{};
  openModal('الإعدادات والتخصيص',
    `<div class="set-sec"><h4>صورتك الشخصية</h4>
       <div class="avatar-up"><span class="pv" id="av_pv">${me.avatar?`<img src="${esc(me.avatar)}">`:esc(me.name[0])}</span>
         <label><span class="ab" id="av_pick">اختار صورة</span><input type="file" id="av_file" accept="image/*" class="hidden"><div class="hint">PNG/JPG/WEBP · حد أقصى 4 ميجا · تتخزن بأمان على السيرفر</div></label></div></div>
     <div class="set-sec"><h4>لون اسمك الصلب</h4><div class="swatches" id="set_colors"></div></div>
     <div class="set-sec"><h4>تدرج ثابت للاسم</h4><div class="grads" id="set_grads"></div></div>
     <div class="set-sec"><h4>خط الاسم</h4><div class="fonts" id="set_fonts"></div></div>
     <div class="set-sec"><h4>تدرج مخصص (3 ألوان)</h4><div class="cgrad-box">
       <div class="cgrad-row"><label>لون 1</label><input type="color" id="cg0" value="${setCgrad.c0}"><label>لون 2</label><input type="color" id="cg1" value="${setCgrad.c1}"><label>لون 3</label><input type="color" id="cg2" value="${setCgrad.c2}"></div>
       <div class="cgrad-types"><button data-t="m" class="on">mesh</button><button data-t="h">أفقي</button><button data-t="v">رأسي</button></div>
       <div class="cgrad-preview" id="cg_prev">معاينة اسمك</div>
       <button class="set-save" id="cg_apply" style="margin-top:10px">تطبيق التدرج المخصص</button>
       <button class="pf-btn b3" id="cg_clear" style="width:100%;margin-top:7px">إلغاء التدرج المخصص</button></div></div>
     <div class="set-sec"><h4>البروفايل</h4>
       <div class="set-field"><label>الحالة (mood)</label><input id="set_mood" maxlength="80" value="${esc(me.mood||'')}"></div>
       <div class="set-field"><label>نبذة</label><textarea id="set_bio" maxlength="300">${esc(u.bio||'')}</textarea></div>
       <div class="set-row"><div class="set-field"><label>الدولة</label><input id="set_country" maxlength="40" value="${esc(u.country||'')}"></div><div class="set-field"><label>العمر</label><input id="set_age" type="number" min="0" max="99" value="${u.age||''}"></div></div>
       <button class="set-save" id="set_save">حفظ التغييرات</button></div>
     <div class="set-sec"><h4>حمايتك</h4><div class="shield">
       بصمة جهازك: <code>${FP||'—'}</code><br>
       المتصفح: ${isModBrowser?'<span class="warn">معدّل/غير معتاد ⚠️</span>':'<span class="ok">طبيعي ✓</span>'}<br>
       نفس الجهاز بحساب تاني في نفس اللحظة بيتعامل كتنبيه أمان ضد تعدد الدخول.</div></div>
     ${me.token?`<div class="set-sec"><button class="pf-btn b4" id="set_logout" style="width:100%">تسجيل الخروج</button></div>`:''}`);

  // رفع صورة
  $('av_pick').onclick=()=> $('av_file').click();
  $('av_file').onchange=async (e)=>{ const file=e.target.files[0]; if(!file) return;
    if(file.size>4*1024*1024){ toast('الصورة أكبر من 4 ميجا','err'); return; }
    const reader=new FileReader(); reader.onload=async ()=>{
      toast('جاري رفع الصورة...','info');
      try{ const r=await fetch('/api/avatar/upload',{method:'POST',headers:{'Content-Type':'application/json','x-token':me.token},body:JSON.stringify({dataUrl:reader.result})}); const d=await r.json();
        if(d.ok){ me.avatar=d.avatar; if(me._user) me._user.avatar=d.avatar; localStorage.setItem('ac_user',JSON.stringify(me._user||{})); $('av_pv').innerHTML=`<img src="${esc(d.avatar)}">`; toast('تم رفع الصورة ✓','ok'); }
        else toast(d.err||'فشل الرفع','err');
      }catch(err){ toast('فشل الرفع','err'); } };
    reader.readAsDataURL(file); };

  $('set_colors').innerHTML=COLOR_HEX.map((c,i)=>`<div class="sw ${i+1===(me.color||14)?'sel':''}" data-c="${i+1}" style="background:${c}"></div>`).join('');
  $('set_colors').querySelectorAll('.sw').forEach(el=> el.addEventListener('click', ()=>{ $('set_colors').querySelectorAll('.sw').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); me.color=+el.dataset.c; }));
  let g=`<div class="gd ${!me.grad?'sel':''}" data-g="0" style="background:#ccc"></div>`; for(let i=1;i<=80;i++) g+=`<div class="gd ${i===(me.grad||0)?'sel':''} bg${i}" data-g="${i}"></div>`;
  $('set_grads').innerHTML=g;
  $('set_grads').querySelectorAll('.gd').forEach(el=> el.addEventListener('click', ()=>{ $('set_grads').querySelectorAll('.gd').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); me.grad=+el.dataset.g; }));
  $('set_fonts').innerHTML=FONT_NAMES.map((n,i)=>`<div class="ft bf${i} ${i===(me.font||0)?'sel':''}" data-f="${i}">${n}</div>`).join('');
  $('set_fonts').querySelectorAll('.ft').forEach(el=> el.addEventListener('click', ()=>{ $('set_fonts').querySelectorAll('.ft').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); me.font=+el.dataset.f; }));
  const updPrev=()=>{ $('cg_prev').style.backgroundImage=buildCgrad($('cg0').value,$('cg1').value,$('cg2').value,setCgrad.type); };
  ['cg0','cg1','cg2'].forEach(id=> $(id).addEventListener('input',updPrev));
  $('mo_body').querySelectorAll('.cgrad-types button').forEach(b=> b.addEventListener('click', ()=>{ $('mo_body').querySelectorAll('.cgrad-types button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); setCgrad.type=b.dataset.t; updPrev(); }));
  updPrev();
  $('cg_apply').onclick=async ()=>{ setCgrad.c0=$('cg0').value; setCgrad.c1=$('cg1').value; setCgrad.c2=$('cg2').value; me.cgrad=buildCgrad(setCgrad.c0,setCgrad.c1,setCgrad.c2,setCgrad.type); if(me._user) me._user.nameCgrad={c0:setCgrad.c0,c1:setCgrad.c1,c2:setCgrad.c2,type:setCgrad.type}; if(me.token) await saveMe({nameCgrad:{c0:setCgrad.c0,c1:setCgrad.c1,c2:setCgrad.c2,type:setCgrad.type}}); toast('تم تطبيق التدرج المخصص ✓','ok'); };
  $('cg_clear').onclick=async ()=>{ me.cgrad=''; me.grad=0; if(me._user) me._user.nameCgrad=null; if(me.token) await saveMe({clearCgrad:true}); toast('تم إلغاء التدرج','info'); };
  $('set_save').onclick=async ()=>{ me.mood=$('set_mood').value; const payload={mood:me.mood,bio:$('set_bio').value,country:$('set_country').value,age:+$('set_age').value||0,nameColor:me.color,nameGrad:me.grad,nameFont:me.font}; if(me.token){ await saveMe(payload); toast('تم الحفظ ✓','ok'); } else { toast('الضيف يحفظ محلياً بس — سجل حساب','info'); localStorage.setItem('ac_guest',JSON.stringify({color:me.color,grad:me.grad,font:me.font,mood:me.mood})); } };
  if($('set_logout')) $('set_logout').onclick=()=>{ localStorage.removeItem('ac_token'); localStorage.removeItem('ac_user'); location.reload(); };
}
async function saveMe(payload){ try{ const r=await fetch('/api/me/update',{method:'POST',headers:{'Content-Type':'application/json','x-token':me.token},body:JSON.stringify(payload)}); const d=await r.json(); if(d.ok){ absorbUser(d.user); localStorage.setItem('ac_user',JSON.stringify(d.user)); updateRankPill(); } }catch(e){} }

/* راديو */
let radio=null, radioIdx=-1;
$('btn_radio').addEventListener('click', ()=>{
  openModal('الراديو داخل الشات', `<div id="radio_list">${RADIO.map((r,i)=>`<div class="radio-st ${i===radioIdx?'on':''}" data-i="${i}"><span class="rs-ic">${r.ic}</span><span><span class="rs-n">${esc(r.n)}</span><span class="rs-s">${esc(r.s)}</span></span></div>`).join('')}</div><div class="radio-ctl"><button id="radio_toggle">▶</button><input type="range" id="radio_vol" min="0" max="100" value="60"><span id="radio_voln">60%</span></div>`);
  $('mo_body').querySelectorAll('.radio-st').forEach(el=> el.addEventListener('click', ()=>{ radioIdx=+el.dataset.i; $('mo_body').querySelectorAll('.radio-st').forEach(x=>x.classList.remove('on')); el.classList.add('on'); playRadio(radioIdx); }));
  $('radio_toggle').onclick=()=>{ if(!radio){ if(radioIdx<0) radioIdx=0; playRadio(radioIdx); } else if(radio.paused){ radio.play(); $('radio_toggle').textContent='⏸'; } else { radio.pause(); $('radio_toggle').textContent='▶'; } };
  $('radio_vol').oninput=(e)=>{ if(radio) radio.volume=e.target.value/100; $('radio_voln').textContent=e.target.value+'%'; };
});
function playRadio(i){ if(!radio){ radio=new Audio(); radio.volume=0.6; } radio.src=RADIO[i].url; radio.play().then(()=>{ $('radio_toggle').textContent='⏸'; }).catch(()=> toast('تعذّر تشغيل البث','err')); }

/* مودال */
function openModal(title, html){ $('mo_title').textContent=title; $('mo_body').innerHTML=html; $('ov').classList.add('open'); }
function closeModal(){ $('ov').classList.remove('open'); }
$('mo_close').addEventListener('click', closeModal);
$('ov').addEventListener('click', (e)=>{ if(e.target===$('ov')) closeModal(); });

addSys('🏠 مرحباً بك في دردشة العرب — كل رسالة بتديك نقاط وترقّي رتبتك','join');
addSys('⚖️ اكتب /help للأوامر · @اسم للمنشن · الإشراف: /kick /mute /ban','sys');
</script>
