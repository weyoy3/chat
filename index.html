<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع تحميل فيديوهات</title>

  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #e9e9e9;
      margin: 0;
      padding: 0;
      color: #222;
    }

    .header {
      background: #204d74;
      color: #fff;
      padding: 16px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,.3);
    }

    .container {
      max-width: 760px;
      margin: 25px auto;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #aaa;
      margin-bottom: 14px;
    }

    button {
      background: #2d7bd6;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1c5fa8;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .secondary {
      background: #666;
    }

    .secondary:hover {
      background: #444;
    }

    .result {
      display: none;
      margin-top: 18px;
      border: 1px solid #d5d5d5;
      background: #fafafa;
      border-radius: 8px;
      padding: 15px;
    }

    .thumb-wrap {
      text-align: center;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .thumb-wrap img,
    .thumb-wrap video {
      max-width: 100%;
      max-height: 360px;
      display: block;
      margin: auto;
    }

    .qualities {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .quality-btn {
      width: auto;
      margin: 0;
      padding: 8px 14px;
      background: #f2f2f2;
      color: #222;
      border: 1px solid #bbb;
      border-radius: 6px;
      cursor: pointer;
    }

    .quality-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .quality-btn.active {
      background: #2d7bd6;
      color: #fff;
      border-color: #1c5fa8;
    }

    .format-row {
      display: flex;
      gap: 15px;
      align-items: center;
      margin: 8px 0 14px;
    }

    .format-row label {
      display: inline;
      margin: 0;
      font-weight: normal;
    }

    .status {
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      display: none;
    }

    .info {
      background: #e7f1ff;
      border: 1px solid #9cc2ff;
      color: #174e8d;
    }

    .error {
      background: #ffecec;
      border: 1px solid #eb8a8a;
      color: #8f1d1d;
    }

    .small {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin: 20px 0;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .actions button {
      margin: 0;
    }

    @media (max-width: 600px) {
      .header {
        font-size: 22px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    موقع تحميل فيديوهات من الروابط
  </div>

  <div class="container">

    <label for="videoUrl">رابط الفيديو</label>
    <input
      id="videoUrl"
      type="url"
      placeholder="ضع رابط يوتيوب، تيك توك، فيسبوك أو رابط مباشر"
    >

    <label for="platform">المنصة</label>
    <select id="platform">
      <option value="auto">تحديد تلقائي</option>
      <option value="youtube">YouTube</option>
      <option value="facebook">Facebook</option>
      <option value="tiktok">TikTok</option>
      <option value="instagram">Instagram</option>
      <option value="twitter">Twitter / X</option>
      <option value="direct">رابط مباشر</option>
    </select>

    <div class="actions">
      <button onclick="analyzeLink()">جلب الفيديو</button>
      <button class="secondary" onclick="loadDemo()">تجربة رابط مباشر</button>
    </div>

    <div id="status" class="status"></div>

    <div id="result" class="result">
      <div class="thumb-wrap" id="thumbWrap"></div>

      <h3 id="videoTitle" style="margin:0 0 10px;"></h3>
      <div class="small" id="videoDesc"></div>

      <div style="margin:15px 0 5px; font-weight:bold;">
        اختر الصيغة
      </div>

      <div class="format-row">
        <label>
          <input type="radio" name="format" value="mp4" checked onchange="updateDownload()">
          MP4
        </label>

        <label>
          <input type="radio" name="format" value="mp3" onchange="updateDownload()">
          MP3 (صوت فقط)
        </label>
      </div>

      <div style="font-weight:bold; margin-bottom:5px;">
        اختر الجودة
      </div>

      <div class="qualities" id="qualities"></div>

      <button id="downloadBtn" onclick="doDownload()">
        تحميل
      </button>

      <div class="small" style="margin-top: 10px;">
        تم تفعيل التحقيق وجلب الروابط الحقيقية عبر السيرفر بنجاح.
      </div>
    </div>

  </div>

  <div class="footer">
    نموذج واجهة متكامل - يعمل بالربط الفعلي مع السيرفر
  </div>

  <script>
    const sampleVideo = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

    let currentDownloadUrl = "";
    let selectedQuality = "720p";
    let availableFormats = [];

    function setStatus(message, type = "info") {
      const el = document.getElementById("status");
      el.style.display = "block";
      el.className = "status " + type;
      el.textContent = message;
    }

    function clearStatus() {
      document.getElementById("status").style.display = "none";
    }

    function loadDemo() {
      document.getElementById("videoUrl").value = sampleVideo;
      document.getElementById("platform").value = "direct";
      analyzeLink();
    }

    async function analyzeLink() {
      clearStatus();

      const url = document.getElementById("videoUrl").value.trim();
      const result = document.getElementById("result");
      const thumbWrap = document.getElementById("thumbWrap");
      const title = document.getElementById("videoTitle");
      const desc = document.getElementById("videoDesc");

      result.style.display = "none";
      thumbWrap.innerHTML = "";
      currentDownloadUrl = "";
      availableFormats = [];

      if (!url) {
        setStatus("من فضلك أدخل رابط الفيديو أولاً.", "error");
        return;
      }

      setStatus("جاري الاتصال بالسيرفر وجلب معلومات الفيديو...", "info");

      try {
        const response = await fetch('/get-video', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "فشل جلب بيانات الفيديو.");
        }

        // عرض الصورة المصغرة إن وجدت
        if (data.thumbnail) {
          const img = document.createElement("img");
          img.src = data.thumbnail;
          img.alt = "صورة الفيديو";
          thumbWrap.appendChild(img);
        }

        title.textContent = data.title || "فيديو تم جلبه بنجاح";
        desc.textContent = data.duration ? `المدة: ${data.duration} ثانية` : "";

        availableFormats = data.formats || [];

        if (availableFormats.length === 0) {
          setStatus("لم يتم العثور على روابط تحميل لهذا الفيديو.", "error");
          return;
        }

        buildQualities(availableFormats);
        result.style.display = "block";
        setStatus("تم جلب روابط التحميل بنجاح!", "info");
        updateDownload();

      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    function buildQualities(formats) {
      const box = document.getElementById("qualities");
      box.innerHTML = "";

      // تصفية الصيغ واختيار الأولى كافتراضية
      const uniqueQualities = [];
      formats.forEach((f, index) => {
        const qName = f.quality || ('جودة ' + (index + 1));
        uniqueQualities.push({ name: qName, url: f.url });
      });

      if (uniqueQualities.length > 0) {
        selectedQuality = uniqueQualities[0].name;
        currentDownloadUrl = uniqueQualities[0].url;
      }

      uniqueQualities.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "quality-btn" + (idx === 0 ? " active" : "");
        btn.textContent = q.name;

        btn.onclick = function () {
          selectedQuality = q.name;
          currentDownloadUrl = q.url;

          document.querySelectorAll(".quality-btn").forEach(function (b) {
            b.classList.remove("active");
          });

          btn.classList.add("active");
          updateDownload();
        };

        box.appendChild(btn);
      });
    }

    function getSelectedFormat() {
      return document.querySelector('input[name="format"]:checked').value;
    }

    function updateDownload() {
      const btn = document.getElementById("downloadBtn");
      const format = getSelectedFormat();

      if (!currentDownloadUrl) {
        btn.disabled = true;
        btn.textContent = "التحميل غير مفعل";
        return;
      }

      btn.disabled = false;
      btn.textContent = `تحميل ${selectedQuality} (${format.toUpperCase()})`;
    }

    function doDownload() {
      if (!currentDownloadUrl) {
        return;
      }

      const format = getSelectedFormat();
      const a = document.createElement("a");
      a.href = currentDownloadUrl;
      a.download = `video_download.${format}`;
      a.target = "_blank";

      document.body.appendChild(a);
      a.click();
      a.remove();

      setStatus("تم بدء التحميل بنجاح!", "info");
    }
  </script>

</body>
</html>
